# Blueprint do Render (https://render.com/docs/blueprint-spec): sobe a API em
# Docker, um PostgreSQL gerenciado e um disco persistente para as imagens.
# Segredos (JWT_SECRET, EMAIL_API_KEY...) são preenchidos no painel, nunca aqui.
services:
  - type: web
    name: easyfood-api
    runtime: docker
    plan: starter            # disco persistente exige plano pago
    healthCheckPath: /health
    disk:
      name: easyfood-uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: easyfood-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COMMERCIAL_EMAIL
        sync: false

databases:
  - name: easyfood-db
    plan: basic-256mb
    databaseName: easyfood
